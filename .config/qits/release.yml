# How this repository releases: the `app` archetype's cycle, inherited WHOLE.
#
# `archetype: app` names `.config/qits/release-archetypes/app.yml` on the wrapper (qits-qits), and
# qits-ci reads it AT THE SHA OF THE NEWEST VERSION THE WRAPPER HAS RELEASED — not at the wrapper's
# `main` head, which is read only to list its event triggers. That distinction is why this file could
# not say `archetype: app` on the day it was written: a recipe merged to the wrapper's `main` is
# still invisible to every run until a wrapper RELEASE carries it, and naming an archetype the
# released wrapper does not hold composes to ARCHETYPE_UNREADABLE — a settled NO_RUN, which is no CI
# run at all rather than a red one, and a release request parked behind a gate nobody can satisfy.
# Both slots — phase one's QA step and phase two's image publish — come from there, and the
# explanation of what those steps do and why lives there too: the Dockerfile contract the image build
# depends on, the lockfile-origin swap, the build-arg/secret split, and the `curl` the swarm health
# gate needs in the runtime stage. That text is deliberately NOT copied back here. A
# repository-declared slot is a whole-slot override with no per-step merging, so a copy kept here
# would not annotate the recipe, it would REPLACE it — and would go on replacing it, silently, with
# whatever it said the day it was written.
#
# `artifacts:` IS THE ONE THING THIS FILE MUST STILL STATE, and it cannot be defaulted from the
# archetype. qits-projects reads this block out of THIS repository at `refs/tags/<version>`; it never
# opens the wrapper and never resolves an archetype, so a coordinate declared there would be
# invisible to it. The archetype's own release step reads it from here as well, with a `sed -n` that
# matches only a one-line FLOW mapping with `type:` before `name:`, and fails the release unless
# exactly one line comes back — so the form below is load-bearing, not a style. `artifacts: []` is a
# parse error rather than a way to say "nothing".
#
# THE COORDINATE IS THE APPLICATION'S NAME, NOT THE REPOSITORY'S. The repository is
# `qits-landing-app`, and the `-app` suffix is a statement about how it is BUILT; what runs is the
# application `qits-landing` (`.config/qits/deployments.yml`'s `application:`). The deployer pulls
# `qits/<application>:<version>` and the release step pushes exactly what this line names, so the two
# files spell one decision and drift between them is a deployment that pulls an image nobody pushed.
#
# No `sbom:` path, because this build has no sbom target to produce one — the composed postlude
# submits an SBOM only for an artifact that declares a path. No `userflows:` key either: this
# repository has no IT stories, and `userflows: false` is refused outright, so omitting the key is the
# only way to say "none".
archetype: app

artifacts:
  - { type: docker, name: qits/qits-landing }
