        getNewestContentHash: "qits artifacts publish contract; qits-landing-app has no page for it yet"
        getNpmPackument: "qits artifacts publish contract; qits-landing-app has no page for it yet"
        headDaemon: "qits artifacts publish daemon submit; qits-landing-app has no page for it yet"
        headSbom: "qits artifacts publish exists; qits-landing-app has no page for it yet"
        listDaemons: "qits update; qits-landing-app has no page for it yet"
        putDaemon: "qits artifacts publish daemon submit; qits-landing-app has no page for it yet"
        putDocs: "qits artifacts publish changelog; qits-landing-app has no page for it yet"
        putMavenFile: "qits artifacts publish contract; qits-landing-app has no page for it yet"
        putNpmDistTag: "qits artifacts publish contract; qits-landing-app has no page for it yet"
        putNpmPackage: "qits artifacts publish contract; qits-landing-app has no page for it yet"
        putSbom: "qits artifacts publish sbom submit; qits-landing-app has no page for it yet"
      qits-ci-service:
