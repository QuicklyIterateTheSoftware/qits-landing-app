<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- qits-2086: apply a forced scheme stored under qits.appearance.theme before the first paint. -->
    <script>
      try {
        const theme = localStorage.getItem('qits.appearance.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <title>The qits platform</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="qits is the software-delivery platform this estate runs on: repositories, tickets, release requests, pipelines and deployments in one catalogue."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
