<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 9 54 54">
  <!-- Source of public/favicon.ico (rendered at 16, 32 and 48 px): the head zoomed in, without the pitchfork. -->
  <defs>
    <radialGradient id="skin" cx="38%" cy="36%" r="68%">
      <stop offset="0" stop-color="#7cd35a"/>
      <stop offset="0.6" stop-color="#4fa83a"/>
      <stop offset="1" stop-color="#2f6e24"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fffef0"/>
      <stop offset="0.4" stop-color="#fff04a"/>
      <stop offset="1" stop-color="#ffb800"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <clipPath id="mouth"><path d="M26 44.6 L39.5 43.6 L32.8 52 z"/></clipPath>
  </defs>

  <g transform="translate(32 37) scale(1.3) translate(-32 -37)">
  <!-- ears: the far one tucked behind the skull, the near one set back -->
  <g fill="url(#skin)" stroke="#1f4a17" stroke-width="1.4" stroke-linejoin="round">
    <path d="M19 27 L12 12.5 L13 28 L18 36 z"/>
  </g>
  <!-- head, three-quarter view: the back of the skull bulges right, the chin swings left -->
  <path d="M31 14 C42.5 13.5 51 20.5 51 30 C51 39 47 45 41 50.5 C36.5 54.5 31 56.8 27 57 C25.5 54.5 23.5 51.5 21.5 48 C17 42.5 14 36.5 14.5 29.5 C15 20.5 21.5 14.5 31 14 z"
        fill="url(#skin)" stroke="#1f4a17" stroke-width="1.6"/>
  <!-- near ear: rooted where an ear sits on the side of the head, running back toward the back of the skull -->
  <g transform="translate(2.2 0.4)">
  <path d="M44.5 29.5 Q50.5 26.5 57.5 23 Q55 30 50 33.6 Q47.2 35.8 45 36.6 Q43.5 33 44.5 29.5 z"
        fill="url(#skin)" stroke="#1f4a17" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M46.3 31 Q51 28.4 55 25.8 Q52.6 30.6 49 32.8 Q47.5 33.8 46.3 34 z" fill="#2f6e24" opacity="0.7"/>
  </g>
  <!-- face, turned toward the upper left -->
  <g transform="translate(-4.6 -1.2)">
  <g transform="translate(29.5 32) scale(0.62 1) translate(-29.5 -32)">
    <ellipse cx="23" cy="33.5" rx="7.5" ry="6" filter="url(#glow)" fill="#ffe100" opacity="0.85"/>
    <path d="M16 30.5 Q22 27 29.5 32 Q27 38.5 22 38.3 Q16.5 37.3 16 30.5 z" fill="url(#eye)" stroke="#b37a00" stroke-width="0.6"/>
    <circle cx="22.6" cy="31.6" r="0.9" fill="#ffffff"/>
  </g>
  <g transform="translate(34.5 32) scale(1.06) translate(-34.5 -32)">
    <ellipse cx="41" cy="33.5" rx="7.5" ry="6" filter="url(#glow)" fill="#ffe100" opacity="0.85"/>
    <path d="M48 30.5 Q42 27 34.5 32 Q37 38.5 42 38.3 Q47.5 37.3 48 30.5 z" fill="url(#eye)" stroke="#b37a00" stroke-width="0.6"/>
    <circle cx="39" cy="31.6" r="0.9" fill="#ffffff"/>
  </g>
  <g transform="translate(39.5 44) scale(0.9 1) translate(-39.5 -44)">
    <path d="M26 44.6 L39.5 43.6 L32.8 52 z" fill="#2a0f0f"/>
    <path d="M26.00 44.60 L29.83 47.64 L29.45 44.51 L31.79 47.49 L32.75 44.27 L33.75 47.35 L36.06 44.02 L35.71 47.20 L39.50 43.60 z" fill="#fffbe6" stroke="#3a1f10" stroke-width="0.5" stroke-linejoin="miter" clip-path="url(#mouth)"/>
    <path d="M30.22 49.19 L31.50 47.60 L32.78 50.20 L34.06 47.20 L35.35 48.81 L32.8 52 z" fill="#f3ecd0" stroke="#3a1f10" stroke-width="0.5" stroke-linejoin="miter" clip-path="url(#mouth)"/>
    <path d="M26 44.6 L39.5 43.6 L32.8 52 z" fill="none" stroke="#1f4a17" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M39.5 43.6 q1.5 -0.5 2.2 -1.9" fill="none" stroke="#1f4a17" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  </g>
  </g>
</svg>
